[package]
name = "gamejolt-rs"
version = "0.1.0"
edition = "2024"
description = "The most advanced Game Jolt Game API v1_2 crate in existence"
repository = "https://github.com/Seigh-sword/gamejolt-rs"
license = "Apache-2.0"
keywords = ["gamejolt", "api", "leaderboard", "achievements", "datastore"]
categories = ["api-bindings", "game-development", "network-programming"]

[lib]
name = "gamejolt_rs"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"], default-features = false }
tracing = "0.1"
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
async-stream = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }
bincode = { version = "3", optional = true }
bytes = "1"
parking_lot = "0.12"
dashmap = "5"
once_cell = "1"
futures = "0.3"
serde_bytes = "0.11"
url = "2"
bevy = { version = "0.15", optional = true, default-features = false }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

[features]
default = ["scores", "users", "sessions", "sha1"]
full = [
    "scores", "users", "sessions", "trophies", "datastore", 
    "friends", "time", "batch", "offline-queue", "reactive",
    "rate-limiter", "session-manager", "md5", "sha1"
]
scores = []
users = []
sessions = []
trophies = []
datastore = []
friends = []
time = []
batch = []
offline-queue = ["dep:bincode"]
reactive = ["dep:async-stream", "dep:tokio-stream", "scores"]
bevy = ["dep:bevy", "session-manager", "offline-queue", "reactive", "rate-limiter"]
wasm = []
md5 = ["dep:md-5"]
sha1 = ["dep:sha1"]
rate-limiter = []
session-manager = ["reactive", "sessions"]

[[example]]
name = "bevy_integration"
required-features = ["bevy"]

[[example]]
name = "offline_queue"
required-features = ["offline-queue"]

[[example]]
name = "wasm_web"
required-features = ["wasm"]

[[example]]
name = "auto_session"
required-features = ["sessions", "session-manager"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Window", "Navigator"], optional = true }
gloo-net = { version = "0.7", optional = true }
gloo-timers = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }